        // Render Function
        function render() {
            const root = document.getElementById('app-root');
            const desktopNav = document.getElementById('desktop-nav');
            const mobileNav = document.getElementById('mobile-nav');
            
            // Hide nav on resume page
            const isResume = state.currentPath === '#/resume';
            document.querySelector('nav').style.display = isResume ? 'none' : 'block';
            document.querySelector('footer').style.display = isResume ? 'none' : 'block';
            root.style.paddingTop = isResume ? '0' : '5rem';

            // Render Nav Links
            const linksHtml = navLinks.map(link => `
                <a href="${link.path}" class="text-sm font-medium transition-colors hover:text-indigo-600 ${state.currentPath === link.path ? 'text-indigo-600' : 'text-slate-600'}">${link.name}</a>
            `).join('');
            
            const mobileLinksHtml = navLinks.map(link => `
                <a href="${link.path}" class="block text-lg font-medium ${state.currentPath === link.path ? 'text-indigo-600' : 'text-slate-600'}" onclick="toggleMobileMenu()">${link.name}</a>
            `).join('');

            desktopNav.innerHTML = linksHtml;
            mobileNav.innerHTML = mobileLinksHtml;

            // Render Page
            switch(state.currentPath) {
                case '#/': root.innerHTML = Home(); break;
                case '#/about': root.innerHTML = About(); break;
                case '#/projects': root.innerHTML = Projects(); break;
                case '#/certifications': root.innerHTML = Certifications(); break;
                case '#/achievements': root.innerHTML = Achievements(); break;
                case '#/resume': root.innerHTML = Resume(); break;
                case '#/certificate': root.innerHTML = Certificate(); break;
                case '#/certificate-coursera': root.innerHTML = Certificate(); break;
                default: root.innerHTML = Home();
            }

            // Initialize Lucide Icons
            lucide.createIcons();
        }

        // Mobile Menu Toggle
        function toggleMobileMenu() {
            const mobileNav = document.getElementById('mobile-nav');
            state.isMobileMenuOpen = !state.isMobileMenuOpen;
            if (state.isMobileMenuOpen) {
                mobileNav.classList.remove('hidden');
            } else {
                mobileNav.classList.add('hidden');
            }
        }

        // Print Resume or notify if framed
        function printResume() {
            window.focus();
            const isInIframe = (() => {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    return true;
                }
            })();

            if (isInIframe) {
                const toastId = 'iframe-print-toast';
                let toast = document.getElementById(toastId);
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = toastId;
                    toast.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-800 text-white px-6 py-4 rounded-2xl shadow-2xl flex flex-col gap-2 z-50 text-sm max-w-sm transition-all no-print animate-bounce';
                    toast.innerHTML = `
                        <div class="flex items-center gap-2 font-bold text-amber-400">
                            <i data-lucide="alert-circle" size="18"></i>
                            <span>Preview Mode Notice</span>
                        </div>
                        <p class="text-slate-300 text-xs leading-relaxed">
                            Websites cannot trigger printing inside sandboxed preview frames. Please <strong>open this portfolio in a new tab</strong> (using the arrow/split icon at the top-right of your screen), then click "Save as PDF / Print" to save smoothly!
                        </p>
                        <button onclick="this.parentElement.remove()" class="mt-1 text-xs text-indigo-400 hover:text-indigo-300 font-bold self-end focus:outline-none cursor-pointer">Got it</button>
                    `;
                    document.body.appendChild(toast);
                    lucide.createIcons();
                }
                try { window.print(); } catch (e) {}
            } else {
                window.print();
            }
        }

        document.getElementById('mobile-menu-toggle').addEventListener('click', toggleMobileMenu);

        // Init
        document.getElementById('current-year').textContent = new Date().getFullYear();
        render();
    </script>
